[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vacant-home-detection"
version = "0.1.0"
description = "Vacant-home recognition from residential power time series"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "pyarrow>=18,<26",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vacant-home = "vacant_home.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vacant_home.high_power" = ["decision_spec.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
